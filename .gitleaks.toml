# gitleaks configuration. The default rules stay on; this file only adds
# allowlists, and each one says why it is safe.
title = "phasor-schemas"

[extend]
useDefault = true

[[allowlists]]
description = "Lockfile integrity hashes"
paths = ['''(^|/)Cargo\.lock$''']

[[allowlists]]
description = "AEMO's published files and the records of them: hashes of public files are not keys"
paths = ['''^(evidence|sources|nem|testdata)/''', '''^manifest\.json$''']

[[allowlists]]
description = "The listing crate's fixtures are nemweb's and the WA host's pages as served; nemweb's carry its own public Application Insights key"
paths = ['''^crates/phasor-listing/testdata/''']
