    ["FOR_AUCTION_PUBLICATION", "VARCHAR2(3)", true, "Flag to indicate if the product component can be published in the public auction reports, for example yes or no."],
    ["LASTCHANGED", "DATE", true, "The date and time the report was generated."],
]

[tables.GSH_SHIPPER_CAP_XFR_NOTICE]
comment = "Provides the status of a trading participant’s capacity transfer related to one or more capacity trades. This notice is issued each time a capacity transfer record has a status change because of capacity transfer in the facility operator system or AEMO system. For non-STTM and non-DWGM capacity products, the status is reported as received from the facility operator. For STTM and DWGM capacity products, the status is reported once the capacity transfer has been completed in the relevant market system (STTM or DWGM)."
primary_key = ["CAPACITY_TRANSFER_ID"]
columns = [
    ["CAPACITY_TRANSFER_ID", "VARCHAR2(20)", false, "The unique AEMO defined Capacity Transfer transaction identifier."],
    ["GAS_DATE", "DATE", true, "The gas date for the capacity change. Disregard the time component as this is not applicable."],
    ["PARTICIPANT_CODE", "VARCHAR2(20)", true, "The participant code used in the ETS."],
    ["PARTICIPANT_NAME", "VARCHAR2(80)", true, "The descriptive name of the participant."],
    ["FACILITY_ID", "NUMBER(8,0)", true, "The unique facility identifier as defined in the Transportation Facility Register."],
    ["FACILITY_NAME", "VARCHAR2(100)", true, "The descriptive name of the facility as defined in the Transportation Facility Register."],
    ["SERVICE_REFERENCE", "VARCHAR2(255)", true, "The service reference issued by the facility operator."],
    ["STTM_CONTRACT_REFERENCE", "VARCHAR2(255)", true, "The STTM registered facility service identifier (CRN) associated with the service reference."],
    ["DWGM_REFERENCE", "VARCHAR2(255)", true, "The DWGM accreditation reference associated with the transfer."],
    ["RECEIPT_POINT_ID", "NUMBER(8,0)", true, "The unique identifier of the Receipt Point as defined in the Transportation Service Point Register. This is the point where gas is injected into the pipeline"],
    ["RECEIPT_POINT_NAME", "VARCHAR2(255)", true, "The descriptive name of the Receipt Point as defined in the Transportation Service Point Register."],
    ["DELIVERY_POINT_ID", "NUMBER(8,0)", true, "The unique identifier of the Delivery Point as defined in the Transportation Service Point Register. This is the point where gas is withdrawn from the pipeline."],
    ["DELIVERY_POINT_NAME", "VARCHAR2(255)", true, "The descriptive name of the Delivery Point as defined in the Transportation Service Point Register."],
    ["RECEIPT_ZONE_ID", "NUMBER(8,0)", true, "The unique identifier of the Receipt Zone as defined in the Transportation Service Point Register."],
    ["RECEIPT_ZONE_NAME", "VARCHAR2(255)", true, "The descriptive name of the Receipt Zone as defined in the Transportation Service Point Register."],
    ["DELIVERY_ZONE_ID", "NUMBER(8,0)", true, "The unique identifier of the Delivery Zone as defined in the Transportation Service Point Register."],
    ["DELIVERY_ZONE_NAME", "VARCHAR2(255)", true, "The descriptive name of the Delivery Zone as defined in the Transportation Service Point Register."],
    ["STATUS", "VARCHAR2(20)", true, "The status of the capacity transfer, for example Transferred, Partial, Pending, Rejected or Cancelled."],
    ["SYSTEM", "VARCHAR2(20)", true, "The system that has processed the capacity transfer, for example Facility operator, AEMO, AEMO STTM or AEMO DWGM."],
    ["REASON", "VARCHAR2(40)", true, "The reason for a rejected or cancelled capacity transfer, for example Buyer delivery contract, Seller delivery fault, system issue or matching record not found."],
    ["TRANSACTION_COMPLETED_FLAG", "VARCHAR2(3)", true, "Flag to indicate whether the capacity transfer process is completed, for example yes or no."],
    ["OVERALL_QUANTITY_CHANGE", "NUMBER(10,0)", true, "The overall capacity quantity adjustment (GJ/day) applied to the relevant contracts for this transfer date and gas date. This is a signed value (+/-)."],
    ["LASTCHANGED", "DATE", true, "The date and time the report was generated."],
]

[tables.GSH_SUPP_ADHOC]
comment = "The Settlements Supporting Data Report is generated when Final and Revision settlement statements are issued; it is also generated daily with details of the latest initial settlement run of the day. The report contains settlements summary information as well as participant specific data from that settlement run for the relevant charges and payments per gas day. It provides a breakdown of all executed trades and delivered quantities records included in this settlement run to assist participant in their settlement statements reconciliation. The Adhoc subreport provides a list of all individual ad-hoc payments and charges included in the settlement run."
primary_key = ["GAS_DATE", "PARTICIPANT_CODE", "SETTLEMENT_RUN_ID", "TYPE"]
columns = [
