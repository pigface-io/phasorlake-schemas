    ["DELIVERY_POINT", "VARCHAR2(40)", true, "Delivery point/s and associated quantities determined as part of SUC7407a – Perform Participant Location Netting. OR NULL if the participant has a zero net position."],
    ["DELIVERY_TYPE_ALERT", "VARCHAR2(20)", true, "This field is empty if the transaction is an output of the delivery-netting module. If the transaction is an original executed trade (due to a system failure), this field shows “Individual Contract Delivery”."],
    ["LASTCHANGED", "DATE", true, "The date and time the report was generated"],
    ["ETS_TRADE_ID", "VARCHAR2(20)", true, "The exchange transaction ID associated with the delivery obligation for transactions in non-netted products. This field can be cross referenced with the TRADE_ID field in the Trade Execution report to identify the transaction price. This field is empty for trades involving netted products."],
    ["RECEIPT_POINT", "VARCHAR2(40)", true, "Receipt point specified by the buyer or seller in an order submission for capacity products"],
]

