    ["LASTCHANGED", "DATE", true, "The date and time the report was generated."],
]

[tables.GSH_DELIVERED_QUANTITY]
comment = "The purpose of this report is to provide the Participants (buyer and seller) an acknowledgement whenever a delivered quantity record is submitted or confirmed. The report will also provide Participants with a list of all their delivered quantity records updated within the last thirty days when triggered daily prior to the start of trades for the current day."
primary_key = ["GAS_DATE", "TRANSACTION_ID", "VERSION_DATETIME"]
columns = [
    ["GAS_DATE", "DATE", false, "The delivery gas day of the trade"],
    ["TRANSACTION_ID", "VARCHAR2(20)", false, "Unique identifier for the transaction"],
    ["VERSION_DATETIME", "DATE", false, "The date and time of when the entry was last modified in the source table."],
    ["BUYER_PARTICIPANT_CODE", "VARCHAR2(20)", true, "The participant code used in the Exchange Trading System (ETS)"],
    ["BUYER_PARTICIPANT_NAME", "VARCHAR2(80)", true, "The name for the participant on buy side of the trade"],
    ["SELLER_PARTICIPANT_CODE", "VARCHAR2(20)", true, "The participant code used in the Exchange Trading System (ETS) for the participant on the seller side of the trade"],
    ["SELLER_PARTICIPANT_NAME", "VARCHAR2(80)", true, "The name for the participant on seller side of the trade"],
    ["PRODUCT_LOCATION", "VARCHAR2(80)", true, "The product location for the Gas Supply Hub market"],
    ["TRANSACTION_QUANTITY", "NUMBER(18,8)", true, "Initial gas volume of the transaction in GJ/day"],
    ["SETTLEMENTS_OFF_MARKET", "VARCHAR2(1)", true, "Indicates whether the buyer and seller wish to settle the delivery variance outside of the GSH market. Valid values are: Y, N"],
    ["DELIVERED_QUANTITY", "NUMBER(18,8)", true, "The delivered quantity in GJ/day"],
    ["REASON_FOR_VARIATION", "VARCHAR2(80)", true, "The reason for the variance in the delivered quantity"],
    ["STATUS", "VARCHAR2(20)", true, "The status of the delivery confirmation. Valid values are: SUBMITTED, CONFIRMED"],
    ["LAST_UPDATED_BY_PARTICIPANT", "VARCHAR2(20)", true, "The participant code used in the Exchange Trading System (ETS) for the participant who last updated the delivered quantity record"],
    ["LAST_UPDATED", "DATE", true, "The date and time the delivered quantity was updated i.e. saved into database"],
    ["LASTCHANGED", "DATE", true, "The date and time the report was generated"],
    ["ETS_TRADE_ID", "VARCHAR2(20)", true, "The exchange transaction ID associated with the delivery obligation for transactions in non-netted products. This field can be cross referenced with the TRADE_ID field in the Trade Execution report to identify the transaction price. This field is empty for trades involving netted products"],
]

[tables.GSH_DELIVERY_NETT_POINTS]
