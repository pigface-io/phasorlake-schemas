    ["FACILITY_ID", "NUMBER(8,0)", false, "The unique identifier of the facility."],
    ["FACILITY_NAME", "VARCHAR2(100)", true, "The descriptive name of the facility."],
    ["SERVICE_TYPE", "VARCHAR2(20)", false, "The type of service, for example Forward Haul, Backhaul or Compression."],
    ["AGG_CLEARED_QUANTITY", "NUMBER(10,0)", true, "The aggregated initial cleared capacity quantity as determined by the auction (GJ/day)."],
    ["AGG_REVISED_QUANTITY", "NUMBER(10,0)", true, "The aggregated revised auction capacity quantity (GJ/day)."],
    ["LASTCHANGED", "DATE", true, "The date and time the report was generated."],
]

[tables.GSH_SECDEPOSIT_INTEREST_RATE]
