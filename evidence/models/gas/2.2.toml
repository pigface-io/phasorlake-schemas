[tables.GSH_TRANSACTION_SUMMARY]
comment = "The report provides a summary of all trades executed in the current gas day per product. It provides information on the high/low open/close prices, total traded quantities and number of trades."
primary_key = ["CURRENTDATE", "FROM_GAS_DATE", "PRODUCT_LOCATION", "PRODUCT_TYPE", "TO_GAS_DATE"]
columns = [
    ["CURRENTDATE", "DATE", false, "The current gas date"],
    ["PRODUCT_LOCATION", "VARCHAR2(80)", false, "Product location for the Gas Supply Hub market"],
    ["PRODUCT_TYPE", "VARCHAR2(80)", false, "The product delivery period for the Gas Supply Hub market"],
    ["FROM_GAS_DATE", "DATE", false, "The start gas day for the order delivery period"],
    ["TO_GAS_DATE", "DATE", false, "The end gas day for the order delivery period"],
    ["HIGH_PRICE", "NUMBER(18,8)", true, "Highest price between all trades executed today per product in $/GJ"],
    ["LOW_PRICE", "NUMBER(18,8)", true, "Lowest price between all trades executed today per product in $/GJ"],
    ["OPEN_PRICE", "NUMBER(18,8)", true, "The first price of all trades executed today per product in $/GJ"],
    ["CLOSE_PRICE", "NUMBER(18,8)", true, "The last price of all trades executed today per product in $/GJ"],
    ["VOLUME_WEIGHTED_AVERAGE_PRICE", "NUMBER(18,8)", true, "The volume weighted average price for all trades executed today per product in $/GJ"],
    ["TOTAL_QUANTITY", "NUMBER(18,8)", true, "Total traded quantities for all trades executed today per product in GJ/day"],
    ["TOTAL_NUMBER_OF_TRADES", "NUMBER(18,0)", true, "Total number of all executed trades today per product"],
    ["LASTCHANGED", "DATE", true, "The date and time the report was generated"],
]

[tables.GSH_ZONES]
comment = "Zones currently registered under Part 24 of the Rules for the capacity trading and day ahead auction."
primary_key = ["EFFECTIVEDATE", "VERSION_DATETIME", "ZONE_ID"]
columns = [
    ["ZONE_ID", "NUMBER(8,0)", false, "The unique identifier of the zone."],
    ["EFFECTIVEDATE", "DATE", false, "Effective date of the record"],
    ["VERSION_DATETIME", "DATE", false, "Version timestamp of the record"],
    ["ZONE_NAME", "VARCHAR2(100)", true, "The descriptive name of the zone."],
    ["ZONE_TYPE", "VARCHAR2(20)", true, "The type of zone, for example pipeline receipt, pipeline delivery, compression receipt or compression delivery."],
    ["ZONE_DESCRIPTION", "VARCHAR2(400)", true, "The description of the zone."],
    ["FOR_AUCTION_PUBLICATION", "VARCHAR2(3)", true, "Flag to indicate if the product component can be published in the public auction reports, for example yes or no."],
    ["LASTCHANGED", "DATE", true, "The date and time the report was generated."],
]

[tables.GSH_ZONE_CURTAILMENT]
comment = "Contains details of curtailment of nominations against secondary firm rights (CTP trades) for service points (receipt and delivery points)."
primary_key = ["FACILITY_ID", "GAS_DATE", "SERVICE_POINT_ID"]
columns = [
    ["FACILITY_ID", "NUMBER(8,0)", false, "The unique identifier of the parent facility."],
    ["FACILITY_NAME", "VARCHAR2(100)", true, "The descriptive name of the parent facility."],
    ["SERVICE_POINT_ID", "NUMBER(8,0)", false, "The unique identifier of the service point."],
    ["SERVICE_POINT_NAME", "VARCHAR2(100)", true, "The descriptive name of the service point."],
    ["SERVICE_POINT_TYPE", "VARCHAR2(100)", true, "The type of service point, for example forward haul receipt point, forward haul delivery point, backhaul receipt point, backhaul delivery point, compression receipt point or compression delivery point."],
    ["SERVICE_POINT_DESCRIPTION", "VARCHAR2(255)", true, "The description of the service point."],
    ["GAS_DATE", "DATE", false, "The effective gas date of the rejected nomination quantity."],
    ["CURTAILED_QUANTITY", "NUMBER(10,0)", true, "The curtailed quantity of nominations by the facility operator for transportation capacity that has been transferred pursuant to an operational transfer (GJ)"],
    ["LASTCHANGED", "DATE", true, "The date and time the report was generated."],
]
