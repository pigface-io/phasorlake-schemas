[tables.GSH_TRADES]
comment = "The purpose of this report is to provide the Participants (buyer and seller) a confirmation whenever a trade is executed through auto matching of bids and offers or by off-Market trades. The report will also provide Participants with a list of all their future trades when triggered daily after the end of the trades for the current day."
primary_key = ["MARKET_ID", "TRADE_ID"]
columns = [
    ["MARKET_ID", "VARCHAR2(20)", false, "Unique Market ID"],
    ["TRADE_ID", "VARCHAR2(20)", false, "Unique trade id generated by the Trading Platform at the time a transaction is executed"],
    ["BUYER_PARTICIPANT_CODE", "VARCHAR2(20)", true, "The participant code used in the Exchange Trading System (ETS) for the participant on buy side of the trade"],
    ["BUYER_PARTICIPANT_NAME", "VARCHAR2(80)", true, "The name for the participant on buy side of the trade"],
    ["SELLER_PARTICIPANT_CODE", "VARCHAR2(20)", true, "The participant code used in the Exchange Trading System (ETS) for the participant on the seller side of the trade"],
    ["SELLER_PARTICIPANT_NAME", "VARCHAR2(80)", true, "The name for the participant on seller side of the trade"],
    ["FROM_GAS_DATE", "DATE", true, "The start gas day for the order delivery period"],
    ["TO_GAS_DATE", "DATE", true, "The end gas day for the order delivery period"],
    ["TRADE_DATETIME", "DATE", true, "Date and time the trade is executed"],
    ["TRADE_TYPE", "VARCHAR2(20)", true, "The type of the trade. Valid values are: AUTO_MATCHED, OFF_MARKET_TRADE"],
    ["PRODUCT_LOCATION", "VARCHAR2(80)", true, "Product location for the Gas Supply Hub market"],
    ["PRODUCT_TYPE", "VARCHAR2(80)", true, "The product delivery period for the Gas Supply Hub market"],
    ["TRADE_QUANTITY", "NUMBER(18,8)", true, "Volume of gas transacted on the Trading Platform in GJ/day"],
    ["TRADE_PRICE", "NUMBER(18,8)", true, "Price value of the trade in $/GJ"],
    ["DELIVERY_POINT", "VARCHAR2(40)", true, "Delivery Point specified by the seller in an order submission for non-netted commodity products, or the buyer or seller in an order submission for capacity products"],
    ["ORDER_ID", "VARCHAR2(20)", true, "The id of the order used in the trade from the buyer or the seller side depending on the participant getting the report. This field will be null if the TRADE_TYPE is off-market or rarely if the network goes down"],
    ["LAST_UPDATED", "DATE", true, "The date and time the trade was updated i.e. saved into database"],
    ["LASTCHANGED", "DATE", true, "The date and time the report was generated"],
    ["BUYER_USER_NAME", "VARCHAR2(100)", true, "Name of the buyer''s account that made submission to the exchange"],
    ["SELLER_USER_NAME", "VARCHAR2(100)", true, "Name of the seller''s account that made submission to the exchange"],
    ["RELATIONSHIP_ID", "VARCHAR2(20)", true, "Populated for transactions executed as part of a spread product. Trades triggered by the matching of orders in a spread product will have the same RELATIONSHIP_ID"],
    ["RECEIPT_POINT", "VARCHAR2(40)", true, "Receipt Point specified by the buyer or seller in an order submission for capacity products"],
    ["VALID_SERVICE_REFERENCE", "VARCHAR2(3)", true, "Flag to indicate whether a valid service reference exists for the traded capacity product. Will be NULL for trades involving commodity products"],
    ["VALID_STTM_CONTRACT_REFERENCE", "VARCHAR2(3)", true, "Flag to indicate whether a valid STTM contract reference exists for the traded capacity product. Will be NULL for trades involving commodity products and non-STTM integrated capacity products"],
    ["VALID_DWGM_REFERENCE", "VARCHAR2(3)", true, "Flag to indicate whether a valid DWGM accreditation reference exists for the traded capacity product where a DWGM interface point has been specified. Will be NULL for trades involving commodity products and capacity products that do not have a DWGM interface point specified"],
    ["TRADE_STATUS", "VARCHAR2(20)", true, "Status of the trade, for example Accepted, Rejected or Cancelled. Capacity trades are rejected if a valid service reference or STTM contract reference does not exist for the product"],
    ["GAS_FUTURE_ID", "VARCHAR2(20)", true, "The EFP Trade ID for matching trades"],
]

