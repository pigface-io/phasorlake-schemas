# Git hooks, run by prek (https://prek.j178.dev). Install them with
# `just hooks`; run them all with `just check`.
#
# Every hook calls a `just` recipe or a builtin, so the hooks, `just` and CI
# run the same commands. Hooks are filtered by path: a commit runs only the
# checks for the files it touches.
#:schema https://www.schemastore.org/prek.json

default_install_hook_types = ["pre-commit", "pre-push"]
default_stages = ["pre-commit"]

# ── Style ────────────────────────────────────────────────────────────────────

[[repos]]
repo = "builtin"
hooks = [
    # AEMO's files are kept byte for byte.
    { id = "trailing-whitespace", exclude = '^(testdata/|evidence/ctl/)' },
    { id = "end-of-file-fixer", exclude = '^(testdata/|evidence/ctl/|nem/.*/metadata/version-hint\.text$)' },
    { id = "check-yaml" },
    { id = "check-toml" },
    { id = "check-json" },
    { id = "check-merge-conflict" },
    # The evidence is text that git compresses well: a census month and a
    # data-model release are larger than code ever is.
    { id = "check-added-large-files", args = ["--maxkb=200"], exclude = '^(evidence/(census|models|histories)/|nem/)' },
    # A history and its table.json grow with a table's runs: the five-minute
    # predispatch tables have hundreds.
    { id = "check-added-large-files", args = ["--maxkb=1024"], files = '^(evidence/histories/|nem/)' },
    { id = "detect-private-key" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "rust-fmt"
name = "style: rustfmt"
language = "system"
entry = "just fmt-check"
files = '\.rs$'
pass_filenames = false

# ── Lint and test ────────────────────────────────────────────────────────────

[[repos.hooks]]
id = "rust-lint"
name = "lint: clippy and rustdoc (warnings are errors)"
language = "system"
entry = "just lint"
files = '^(crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$)'
pass_filenames = false

[[repos.hooks]]
id = "rust-test"
name = "test: every unit and integration test"
language = "system"
entry = "just test"
files = '^(crates/|Cargo\.(toml|lock)$|testdata/)'
pass_filenames = false

# ── Secrets ──────────────────────────────────────────────────────────────────

[[repos.hooks]]
id = "secrets-staged"
name = "secrets: gitleaks (staged changes)"
language = "system"
entry = "just secrets-staged"
always_run = true
pass_filenames = false

[[repos.hooks]]
id = "secrets-push"
name = "secrets: gitleaks (commits being pushed)"
language = "system"
entry = "just secrets-push"
stages = ["pre-push"]
always_run = true
pass_filenames = false

# ── Before a push ────────────────────────────────────────────────────────────

[[repos.hooks]]
id = "rust-cover"
name = "coverage: every crate, held to coverage.json"
language = "system"
entry = "just cover"
stages = ["pre-push"]
files = '^(crates/|Cargo\.(toml|lock)$|testdata/|coverage\.json$)'
pass_filenames = false

[[repos.hooks]]
id = "ratchet"
name = "coverage: no floor dropped"
language = "system"
entry = "just ratchet"
stages = ["pre-push"]
files = '^coverage\.json$'
pass_filenames = false

[[repos.hooks]]
id = "export-check"
name = "export: nem/ is what the evidence exports"
language = "system"
entry = "just export-check"
stages = ["pre-push"]
files = '^(evidence|tables|crates)/'
pass_filenames = false

[[repos.hooks]]
id = "compat"
name = "export: nem/ keeps what origin/main published"
language = "system"
entry = "just compat"
stages = ["pre-push"]
files = '^nem/'
pass_filenames = false
