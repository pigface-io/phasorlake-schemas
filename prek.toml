# Git hooks, run by prek (https://prek.j178.dev). Install them with
# `just hooks`; run them all with `just check`.
#
# Every hook calls a `just` recipe or a builtin, so the hooks, `just` and CI
# run the same commands. Hooks are filtered by path: a commit runs only the
# checks for the files it touches.
#:schema https://www.schemastore.org/prek.json

default_install_hook_types = ["pre-commit", "pre-push"]
default_stages = ["pre-commit"]

# ── Style ────────────────────────────────────────────────────────────────────

[[repos]]
repo = "builtin"
hooks = [
    # AEMO's files are kept byte for byte.
    # The manifest lists under the market directories are Avro: bytes, not text.
    { id = "trailing-whitespace", exclude = '^(testdata/|evidence/ctl/)|\.avro$' },
    { id = "end-of-file-fixer", exclude = '^(testdata/|evidence/ctl/|(nem|wem|gas)/.*/metadata/version-hint\.text$)|\.avro$' },
    { id = "check-yaml" },
    { id = "check-toml" },
    { id = "check-json" },
    { id = "check-merge-conflict" },
    # The evidence is text that git compresses well: a census month and a
    # data-model release are larger than code ever is.
    { id = "check-added-large-files", args = ["--maxkb=200"], exclude = '^(evidence/(census|models|histories)/|(nem|wem|gas)/)' },
    # A history and its table metadata grow with a table's runs: the
    # five-minute predispatch tables have hundreds.
    { id = "check-added-large-files", args = ["--maxkb=1024"], files = '^(evidence/histories/|(nem|wem|gas)/)' },
    { id = "detect-private-key" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "rust-fmt"
name = "style: rustfmt"
language = "system"
entry = "just fmt-check"
files = '\.rs$'
pass_filenames = false

# ── Lint and test ────────────────────────────────────────────────────────────

[[repos.hooks]]
id = "rust-lint"
name = "lint: clippy and rustdoc (warnings are errors)"
language = "system"
entry = "just lint"
files = '^(crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$)'
pass_filenames = false

[[repos.hooks]]
id = "old-name"
name = "lint: no file or path names the project's old name"
language = "system"
entry = "just old-name"
always_run = true
pass_filenames = false

[[repos.hooks]]
id = "layers"
name = "lint: crate dependencies are the ones layers.json declares"
language = "system"
entry = "just layers"
files = '^(crates/.*/Cargo\.toml|Cargo\.(toml|lock)|layers\.json)$'
pass_filenames = false

[[repos.hooks]]
id = "errors-doc"
name = "docs: every diagnostic code is in docs/errors.md"
language = "system"
entry = "just errors-check"
files = '^(crates/.*\.rs|docs/errors\.md)$'
pass_filenames = false

[[repos.hooks]]
id = "msg-style"
name = "lint: error messages lower-case first, no trailing period"
language = "system"
entry = "just msg-style"
files = '^(crates/.*\.rs|msg_style\.allow)$'
pass_filenames = false

[[repos.hooks]]
id = "rust-test"
name = "test: every unit and integration test"
language = "system"
entry = "just test"
files = '^(crates/|Cargo\.(toml|lock)$|testdata/)'
pass_filenames = false

# ── Secrets ──────────────────────────────────────────────────────────────────

[[repos.hooks]]
id = "secrets-staged"
name = "secrets: gitleaks (staged changes)"
language = "system"
entry = "just secrets-staged"
always_run = true
pass_filenames = false

[[repos.hooks]]
id = "secrets-push"
name = "secrets: gitleaks (commits being pushed)"
language = "system"
entry = "just secrets-push"
stages = ["pre-push"]
always_run = true
pass_filenames = false

# ── Before a push ────────────────────────────────────────────────────────────

[[repos.hooks]]
id = "rust-cover"
name = "coverage: every crate, held to coverage.json"
language = "system"
entry = "just cover"
stages = ["pre-push"]
files = '^(crates/|Cargo\.(toml|lock)$|testdata/|coverage\.json$)'
pass_filenames = false

[[repos.hooks]]
id = "ratchet"
name = "coverage: no floor dropped"
language = "system"
entry = "just ratchet"
stages = ["pre-push"]
files = '^(coverage\.json|msg_style\.allow)$'
pass_filenames = false

[[repos.hooks]]
id = "export-check"
name = "export: the market directories are what the evidence exports"
language = "system"
entry = "just export-check"
stages = ["pre-push"]
files = '^(evidence|tables|crates)/'
pass_filenames = false

[[repos.hooks]]
id = "compat"
name = "export: the market directories keep what origin/main published"
language = "system"
entry = "just compat"
stages = ["pre-push"]
files = '^(nem|wem|gas)/'
pass_filenames = false

# ── Shell ────────────────────────────────────────────────────────────────────

[[repos.hooks]]
id = "shellcheck"
name = "lint: shellcheck"
language = "system"
entry = "just shellcheck"
files = '\.(sh|bash)$'
pass_filenames = false
