[package]
name = "phasor-diag"
description = "The one shape every error and warning of a phasor repository is reported as: a diagnostic with a stable code, its context, one-line rendering, and the exit codes every binary shares. Pure: no I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
linelog = { workspace = true, optional = true }
serde.workspace = true

[features]
# Diagnostic::log: a diagnostic written as one linelog record.
log = ["dep:linelog"]

[dev-dependencies]
serde_json.workspace = true
