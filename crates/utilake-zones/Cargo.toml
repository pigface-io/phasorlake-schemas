[package]
name = "utilake-zones"
description = "Zones: named stretches of code declared as statics, timed per thread into a call tree whose nodes link to the zone they ran in, with bytes read and copied counted per zone and the tracer's own cost measured and taken out. One dependency, the CPU counter, and no allocation per zone once a path is known."
