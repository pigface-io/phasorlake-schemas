[package]
name = "phasor-zip"
description = "Walks a zip, zips inside zips included, handing each wanted entry on as a streaming reader; reads entries whose local header disagrees with the central directory from the directory, verified."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
phasor-diag.workspace = true
flate2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
phasor-provenance.workspace = true
zip.workspace = true
zonetrace = { workspace = true, optional = true }

[dev-dependencies]
peak_alloc.workspace = true
zonetrace.workspace = true

[[example]]
name = "zipbench"
required-features = ["zones"]

[features]
# Times the walk in zones of zonetrace, with bytes read and copied.
zones = ["dep:zonetrace"]
