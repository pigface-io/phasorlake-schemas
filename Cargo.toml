# nem-schemas: every table of Australia's National Electricity Market data
# as an Apache Iceberg table, derived from AEMO's published files.
#
#   nem-iceberg  the Iceberg contract: types, schemas, the type rule, the
#                interval planner, and table metadata and manifests as bytes.
#                Pure: no I/O.
#   nem-census   reads AEMO's files into a census, folds the census into
#                each table's history, exports the documents under nem/.
#   xtask        repository gates: coverage floors and their ratchet.
[workspace]
resolver = "3"
members = ["crates/nem-iceberg", "crates/xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/pigface-io/nem-schemas"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# A curated slice of the pedantic group: the lints that catch real mistakes or
# needless work, without the ones that only argue about prose and casts.
needless_pass_by_value = "deny"
semicolon_if_nothing_returned = "deny"
redundant_closure_for_method_calls = "deny"
inefficient_to_string = "deny"
implicit_clone = "deny"
manual_let_else = "deny"
unnested_or_patterns = "deny"
map_unwrap_or = "deny"
large_types_passed_by_value = "deny"
ref_option = "deny"
format_push_string = "deny"
unreadable_literal = "deny"
cloned_instead_of_copied = "deny"
explicit_iter_loop = "deny"
uninlined_format_args = "deny"

[workspace.dependencies]
nem-iceberg = { path = "crates/nem-iceberg" }

anyhow = "1"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
