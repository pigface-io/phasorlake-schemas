# utilake-schemas: every table of Australia's National Electricity Market data
# as an Apache Iceberg table, derived from AEMO's published files.
#
#   utilake-iceberg  the Iceberg contract: types, schemas, the type rule, the
#                interval planner, and table metadata and manifests as bytes.
#                Pure: no I/O.
#   utilake-schemas  the tool: fetches AEMO's files, takes their census, folds
#                the census into each table's history, exports nem/.
#   utilake-gates    the repository gates every utilake repository runs from
#                its xtask: coverage floors, their ratchet, benchmark budgets,
#                the agent index, the error catalogue.
#   xtask        this repository's gates: coverage floors and their ratchet.
[workspace]
resolver = "3"
members = [
    "crates/utilake-gates",
    "crates/utilake-iceberg",
    "crates/utilake-schemas",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/g0itb4/utilake-schemas"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# A curated slice of the pedantic group: the lints that catch real mistakes or
# needless work, without the ones that only argue about prose and casts.
needless_pass_by_value = "deny"
semicolon_if_nothing_returned = "deny"
redundant_closure_for_method_calls = "deny"
inefficient_to_string = "deny"
implicit_clone = "deny"
manual_let_else = "deny"
unnested_or_patterns = "deny"
map_unwrap_or = "deny"
large_types_passed_by_value = "deny"
ref_option = "deny"
format_push_string = "deny"
unreadable_literal = "deny"
cloned_instead_of_copied = "deny"
explicit_iter_loop = "deny"
uninlined_format_args = "deny"

[workspace.dependencies]
utilake-gates = { path = "crates/utilake-gates" }
utilake-iceberg = { path = "crates/utilake-iceberg" }

anyhow = "1"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
memchr = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "1"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
