# phasor-schemas: every table of Australia's National Electricity Market data
# as an Apache Iceberg table, derived from AEMO's published files.
#
#   phasor-iceberg  the Iceberg contract: types, schemas, the type rule, the
#                interval planner, and table metadata and manifests as bytes.
#                Pure: no I/O.
#   phasor-schemas  the tool: fetches AEMO's files, takes their census, folds
#                the census into each table's history, exports nem/.
#   phasor-diag     the one shape every error and warning is reported as: a
#                diagnostic with a stable code, and the exit codes. Pure.
#   phasor-decode   what every decoder shares, whatever the format: a row's
#                fields, its position, the month, a normalised name and a
#                column list's fingerprint. Pure.
#   phasor-mms-decode
#                the MMS C/I/D row format: scanner, I rows, shape ids,
#                archive file names. Pure.
#   phasor-plain-decode
#                plain CSV and WEMDE JSON as blocks of rows, dates in the one
#                MMS form, and the names, release months and row-diff rules
#                of every feed that is not MMS. Pure.
#   phasor-provenance
#                what an archived file is and every place AEMO served it:
#                the record beside each file, the one time type, the
#                archive and the rule that names a file's local path.
#   phasor-zip      walking a zip, zips inside zips included, entries whose
#                local header lies read from the central directory. Pure.
#   phasor-gates    the repository gates every phasor repository runs from
#                its xtask: coverage floors, their ratchet, benchmark budgets,
#                the agent index, the error catalogue.
#   xtask        this repository's gates: coverage floors and their ratchet,
#                dependency layers (layers.json), the error catalogue
#                (docs/errors.md) and the message style.
[workspace]
resolver = "3"
members = [
    "crates/phasor-decode",
    "crates/phasor-diag",
    "crates/phasor-gates",
    "crates/phasor-iceberg",
    "crates/phasor-mms-decode",
    "crates/phasor-plain-decode",
    "crates/phasor-provenance",
    "crates/phasor-schemas",
    "crates/phasor-zip",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/pigface-io/phasorlake-schemas"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# A curated slice of the pedantic group: the lints that catch real mistakes or
# needless work, without the ones that only argue about prose and casts.
needless_pass_by_value = "deny"
semicolon_if_nothing_returned = "deny"
redundant_closure_for_method_calls = "deny"
inefficient_to_string = "deny"
implicit_clone = "deny"
manual_let_else = "deny"
unnested_or_patterns = "deny"
map_unwrap_or = "deny"
large_types_passed_by_value = "deny"
ref_option = "deny"
format_push_string = "deny"
unreadable_literal = "deny"
cloned_instead_of_copied = "deny"
explicit_iter_loop = "deny"
uninlined_format_args = "deny"

[workspace.dependencies]
phasor-decode = { path = "crates/phasor-decode" }
phasor-diag = { path = "crates/phasor-diag" }
phasor-gates = { path = "crates/phasor-gates" }
phasor-iceberg = { path = "crates/phasor-iceberg" }
phasor-mms-decode = { path = "crates/phasor-mms-decode" }
phasor-plain-decode = { path = "crates/phasor-plain-decode" }
phasor-provenance = { path = "crates/phasor-provenance" }
phasor-zip = { path = "crates/phasor-zip" }
# zones timed into a call tree: https://github.com/pigface-io/zonetrace
zonetrace = "0.1.1"
# structured records, one line each: https://github.com/pigface-io/linelog
linelog = { git = "ssh://git@github.com/pigface-io/linelog.git", rev = "f5ff0b5c94ad9f8a3d343ae666b00eefccc2db7a", default-features = false }

anyhow = "1"
crc32fast = "1.5"
criterion = { version = "0.8", default-features = false }
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
memchr = "2.8"
peak_alloc = "0.3"
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "1"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
