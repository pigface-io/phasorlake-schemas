# The declaration of MTPASA_REGIONSUMMARY: kept by hand.
name = "MTPASA_REGIONSUMMARY"
package = "MTPASA"
report_pairs = [["MTPASA", "REGIONSUMMARY"]]
primary_key = ["RUN_DATETIME", "RUN_NO", "RUNTYPE", "DEMAND_POE_TYPE", "AGGREGATION_PERIOD", "PERIOD_ENDING", "REGIONID"]
time_column = "RUN_DATETIME"
load_mode = "append"
visibility = "PUBLIC"

[temporal]
cutoff = "RUN_DATETIME"
entity = ["RUNTYPE", "DEMAND_POE_TYPE", "AGGREGATION_PERIOD", "REGIONID"]
order = ["RUN_DATETIME", "RUN_NO", "LASTCHANGED"]
origin = "derived"

[temporal.valid]
column = "PERIOD_ENDING"
kind = "interval_end"
