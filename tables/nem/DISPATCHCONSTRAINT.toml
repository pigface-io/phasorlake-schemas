# The declaration of DISPATCHCONSTRAINT: kept by hand.
name = "DISPATCHCONSTRAINT"
package = "DISPATCH"
report_pairs = [["DISPATCH", "CONSTRAINT"]]
primary_key = ["SETTLEMENTDATE", "RUNNO", "CONSTRAINTID", "DISPATCHINTERVAL", "INTERVENTION"]
time_column = "SETTLEMENTDATE"
load_mode = "append"
visibility = "PUBLIC"

[[distinct]]
columns = ["CONFIDENTIAL_TO", "DUID"]
reason = "CONFIDENTIAL_TO names who may see a constraint row; DUID names the unit it binds: two columns, which some files carry and others do not."
