# The declaration of SETINTRAREGIONRESIDUES: kept by hand.
name = "SETINTRAREGIONRESIDUES"
package = "SETTLEMENT_DATA"
report_pairs = [["SETTLEMENTS", "INTRAREGIONRESIDUES"]]
primary_key = ["SETTLEMENTDATE", "RUNNO", "PERIODID", "REGIONID"]
time_column = "SETTLEMENTDATE"
load_mode = "append"
visibility = "PUBLIC"

# SETTLEMENTDATE labels the trading day the rows are for (04:00 to 04:00 the next day), written at midnight.
[temporal]
entity = ["PERIODID", "REGIONID"]
order = ["RUNNO", "LASTCHANGED"]
cutoff = "LASTCHANGED"
valid = { kind = "day", column = "SETTLEMENTDATE" }
