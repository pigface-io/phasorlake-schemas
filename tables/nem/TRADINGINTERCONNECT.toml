# The declaration of TRADINGINTERCONNECT: kept by hand.
name = "TRADINGINTERCONNECT"
package = "TRADING_DATA"
report_pairs = [["TRADING", "INTERCONNECTORRES"]]
primary_key = ["SETTLEMENTDATE", "RUNNO", "INTERCONNECTORID", "PERIODID"]
time_column = "SETTLEMENTDATE"
load_mode = "append"
visibility = "PUBLIC"

[temporal]
cutoff = "LASTCHANGED"
entity = ["INTERCONNECTORID", "PERIODID"]
order = ["RUNNO", "LASTCHANGED"]
origin = "derived"

[temporal.valid]
column = "SETTLEMENTDATE"
kind = "interval_end"
