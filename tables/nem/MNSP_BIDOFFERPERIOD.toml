# The declaration of MNSP_BIDOFFERPERIOD: kept by hand.
name = "MNSP_BIDOFFERPERIOD"
package = "BIDS"
report_pairs = [["BIDS", "MNSP_BIDOFFERPERIOD"]]
primary_key = ["TRADINGDATE", "OFFERDATETIME", "LINKID", "PERIODID"]
time_column = "TRADINGDATE"
load_mode = "append"
visibility = "PUBLIC"

# TRADINGDATE labels the trading day the rows are for (04:00 to 04:00 the next day), written at midnight.
[temporal]
entity = ["LINKID", "PERIODID"]
order = ["OFFERDATETIME"]
cutoff = "OFFERDATETIME"
valid = { kind = "day", column = "TRADINGDATE" }
