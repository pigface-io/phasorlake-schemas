# The declaration of PREDISPATCHCONSTRAINT: kept by hand.
name = "PREDISPATCHCONSTRAINT"
package = "PRE_DISPATCH"
report_pairs = [["PREDISPATCH", "CONSTRAINT_SOLUTION"]]
primary_key = ["CONSTRAINTID", "DATETIME"]
time_column = "DATETIME"
load_mode = "append"
visibility = "PUBLIC"

[[distinct]]
columns = ["CONFIDENTIAL_TO", "DUID"]
reason = "CONFIDENTIAL_TO names who may see a constraint row; DUID names the unit it binds: two columns, which some files carry and others do not."
