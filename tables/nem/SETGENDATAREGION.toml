# The declaration of SETGENDATAREGION: kept by hand.
name = "SETGENDATAREGION"
package = "SETTLEMENT_DATA"
report_pairs = [["SETTLEMENTS", "GENDATAREGION"]]
primary_key = ["SETTLEMENTDATE", "VERSIONNO", "PERIODID", "REGIONID"]
time_column = "SETTLEMENTDATE"
load_mode = "append"
visibility = "PUBLIC"

# SETTLEMENTDATE labels the trading day the rows are for (04:00 to 04:00 the next day), written at midnight.
[temporal]
entity = ["PERIODID", "REGIONID"]
order = ["VERSIONNO", "LASTCHANGED"]
cutoff = "LASTCHANGED"
valid = { kind = "day", column = "SETTLEMENTDATE" }
