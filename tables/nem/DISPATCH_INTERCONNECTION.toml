# The declaration of DISPATCH_INTERCONNECTION: kept by hand.
name = "DISPATCH_INTERCONNECTION"
package = "DISPATCH"
report_pairs = [["DISPATCH", "INTERCONNECTION"]]
primary_key = ["SETTLEMENTDATE", "RUNNO", "INTERVENTION", "FROM_REGIONID", "TO_REGIONID"]
time_column = "SETTLEMENTDATE"
load_mode = "append"
visibility = "PUBLIC"

[temporal]
cutoff = "LASTCHANGED"
entity = ["INTERVENTION", "FROM_REGIONID", "TO_REGIONID"]
order = ["RUNNO", "LASTCHANGED"]
origin = "derived"

[temporal.valid]
column = "SETTLEMENTDATE"
kind = "interval_end"
