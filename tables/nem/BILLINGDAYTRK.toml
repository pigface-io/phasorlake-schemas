# The declaration of BILLINGDAYTRK: kept by hand.
name = "BILLINGDAYTRK"
package = "BILLING_RUN"
report_pairs = [["BILLING", "DAYTRK"]]
primary_key = ["CONTRACTYEAR", "WEEKNO", "BILLRUNNO", "SETTLEMENTDATE"]
time_column = "SETTLEMENTDATE"
load_mode = "append"
visibility = "PUBLIC"

# SETTLEMENTDATE labels the trading day the rows are for (04:00 to 04:00 the next day), written at midnight.
[temporal]
entity = ["CONTRACTYEAR", "WEEKNO"]
order = ["BILLRUNNO", "RUNNO", "LASTCHANGED"]
cutoff = "LASTCHANGED"
valid = { kind = "day", column = "SETTLEMENTDATE" }
