# The declaration of MNSP_DAYOFFER: kept by hand.
name = "MNSP_DAYOFFER"
package = "BIDS"
report_pairs = [["BIDS", "MNSP_DAYOFFER"]]
primary_key = ["SETTLEMENTDATE", "OFFERDATE", "VERSIONNO", "PARTICIPANTID", "LINKID"]
time_column = "SETTLEMENTDATE"
load_mode = "append"
visibility = "PUBLIC"

# SETTLEMENTDATE labels the trading day the rows are for (04:00 to 04:00 the next day), written at midnight.
[temporal]
entity = ["PARTICIPANTID", "LINKID"]
order = ["OFFERDATE", "VERSIONNO", "LASTCHANGED"]
cutoff = "OFFERDATE"
valid = { kind = "day", column = "SETTLEMENTDATE" }
