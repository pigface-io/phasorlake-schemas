# The declaration of DAYTRACK: kept by hand.
name = "DAYTRACK"
package = "SETTLEMENT_DATA"
report_pairs = [["SETTLEMENTS", "DAYTRACK"]]
time_column = "SETTLEMENTDATE"
load_mode = "append"
visibility = "PUBLIC"

[[distinct]]
columns = ["METERDATA_SOURCE", "METER_RUNTYPE", "METER_CASEID"]
reason = "The archive and the report files carry different metering columns, each with its own meaning; the runs alternate between them."
