# The declaration of DAYTRACK: kept by hand.
name = "DAYTRACK"
package = "SETTLEMENT_DATA"
report_pairs = [["SETTLEMENTS", "DAYTRACK"]]
primary_key = ["SETTLEMENTDATE", "EXPOSTRUNNO"]
time_column = "SETTLEMENTDATE"
load_mode = "append"
visibility = "PUBLIC"

# SETTLEMENTDATE labels the trading day the rows are for (04:00 to 04:00 the next day), written at midnight.
[temporal]
entity = ["EXPOSTRUNNO"]
order = ["LASTCHANGED"]
cutoff = "LASTCHANGED"
valid = { kind = "day", column = "SETTLEMENTDATE" }
