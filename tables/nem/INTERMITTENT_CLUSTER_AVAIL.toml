# The declaration of INTERMITTENT_CLUSTER_AVAIL: kept by hand.
name = "INTERMITTENT_CLUSTER_AVAIL"
package = "DEMAND_FORECASTS"
report_pairs = [["DEMAND", "INTERMITTENT_CLUSTER_AVAIL"]]
primary_key = ["TRADINGDATE", "DUID", "OFFERDATETIME", "CLUSTERID", "PERIODID"]
time_column = "TRADINGDATE"
load_mode = "append"
visibility = "PUBLIC"

# TRADINGDATE labels the trading day the rows are for (04:00 to 04:00 the next day), written at midnight.
[temporal]
entity = ["DUID", "CLUSTERID", "PERIODID"]
order = ["OFFERDATETIME"]
cutoff = "OFFERDATETIME"
valid = { kind = "day", column = "TRADINGDATE" }
