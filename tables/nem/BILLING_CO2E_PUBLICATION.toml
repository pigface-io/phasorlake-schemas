# The declaration of BILLING_CO2E_PUBLICATION: kept by hand.
name = "BILLING_CO2E_PUBLICATION"
package = "BILLING_RUN"
report_pairs = [["BILLING", "BILLING_CO2E_PUBLICATION"]]
primary_key = ["CONTRACTYEAR", "WEEKNO", "SETTLEMENTDATE", "REGIONID"]
time_column = "SETTLEMENTDATE"
load_mode = "append"
visibility = "PUBLIC"

# SETTLEMENTDATE labels the trading day the rows are for (04:00 to 04:00 the next day), written at midnight.
[temporal]
entity = ["CONTRACTYEAR", "WEEKNO", "REGIONID"]
order = ["BILLRUNNO"]
valid = { kind = "day", column = "SETTLEMENTDATE" }
