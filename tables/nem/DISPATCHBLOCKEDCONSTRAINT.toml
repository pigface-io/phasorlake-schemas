# The declaration of DISPATCHBLOCKEDCONSTRAINT: kept by hand.
name = "DISPATCHBLOCKEDCONSTRAINT"
package = "DISPATCH"
report_pairs = [["DISPATCH", "BLOCKED_CONSTRAINTS"]]
primary_key = ["SETTLEMENTDATE", "RUNNO", "CONSTRAINTID"]
