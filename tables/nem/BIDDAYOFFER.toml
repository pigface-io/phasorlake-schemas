# The declaration of BIDDAYOFFER: kept by hand.
name = "BIDDAYOFFER"
package = "BIDS"
report_pairs = [["BIDS", "BIDDAYOFFER"]]
primary_key = ["DUID", "BIDTYPE", "SETTLEMENTDATE", "OFFERDATE"]
time_column = "SETTLEMENTDATE"
load_mode = "append"
visibility = "PUBLIC"

# SETTLEMENTDATE labels the trading day the rows are for (04:00 to 04:00 the next day), written at midnight.
[temporal]
entity = ["DUID", "BIDTYPE"]
order = ["OFFERDATE", "VERSIONNO", "LASTCHANGED"]
cutoff = "OFFERDATE"
valid = { kind = "day", column = "SETTLEMENTDATE" }
