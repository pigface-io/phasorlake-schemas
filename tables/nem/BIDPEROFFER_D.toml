# The declaration of BIDPEROFFER_D: kept by hand.
name = "BIDPEROFFER_D"
package = "BIDS"
report_pairs = [["BID", "BIDPEROFFER_D"]]
time_column = "SETTLEMENTDATE"
load_mode = "append"
visibility = "PUBLIC"

[[distinct]]
columns = ["MR_CAPACITY", "RECALL_PERIOD"]
reason = "MR_CAPACITY (mandatory restrictions capacity) left the bids as RECALL_PERIOD (a unit's recall time) arrived: two meanings, not one column renamed."
