# The declaration of SETFCASREGIONRECOVERY: kept by hand.
name = "SETFCASREGIONRECOVERY"
package = "SETTLEMENT_DATA"
report_pairs = [["SETTLEMENTS", "FCASREGIONRECOVERY"]]
primary_key = ["SETTLEMENTDATE", "VERSIONNO", "BIDTYPE", "REGIONID", "PERIODID"]
time_column = "SETTLEMENTDATE"
load_mode = "append"
visibility = "PUBLIC"

# SETTLEMENTDATE labels the trading day the rows are for (04:00 to 04:00 the next day), written at midnight.
[temporal]
entity = ["BIDTYPE", "REGIONID", "PERIODID"]
order = ["VERSIONNO", "LASTCHANGED"]
cutoff = "LASTCHANGED"
valid = { kind = "day", column = "SETTLEMENTDATE" }
