# The declaration of SET_ANCILLARY_SUMMARY: kept by hand.
name = "SET_ANCILLARY_SUMMARY"
package = "SETTLEMENT_DATA"
report_pairs = [["SETTLEMENTS", "ANCILLARY_SUMMARY"]]
primary_key = ["SETTLEMENTDATE", "VERSIONNO", "SERVICE", "PAYMENTTYPE", "REGIONID", "PERIODID"]
time_column = "SETTLEMENTDATE"
load_mode = "append"
visibility = "PUBLIC"

# SETTLEMENTDATE labels the trading day the rows are for (04:00 to 04:00 the next day), written at midnight.
[temporal]
entity = ["SERVICE", "PAYMENTTYPE", "REGIONID", "PERIODID"]
order = ["VERSIONNO", "LASTCHANGED"]
cutoff = "LASTCHANGED"
valid = { kind = "day", column = "SETTLEMENTDATE" }
