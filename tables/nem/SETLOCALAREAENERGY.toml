# The declaration of SETLOCALAREAENERGY: kept by hand.
name = "SETLOCALAREAENERGY"
package = "SETTLEMENT_DATA"
report_pairs = [["SETTLEMENTS", "LOCALAREAENERGY"]]
primary_key = ["SETTLEMENTDATE", "SETTLEMENTRUNNO", "LOCALAREAID", "PERIODID"]
time_column = "SETTLEMENTDATE"
load_mode = "append"
visibility = "PUBLIC"

# SETTLEMENTDATE labels the trading day the rows are for (04:00 to 04:00 the next day), written at midnight.
[temporal]
entity = ["SETTLEMENTRUNNO", "LOCALAREAID", "PERIODID"]
order = ["LASTCHANGED"]
cutoff = "LASTCHANGED"
valid = { kind = "day", column = "SETTLEMENTDATE" }
