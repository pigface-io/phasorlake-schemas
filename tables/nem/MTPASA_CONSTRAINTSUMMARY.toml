# The declaration of MTPASA_CONSTRAINTSUMMARY: kept by hand.
name = "MTPASA_CONSTRAINTSUMMARY"
package = "MTPASA"
report_pairs = [["MTPASA", "CONSTRAINTSUMMARY"]]
primary_key = ["RUN_DATETIME", "RUN_NO", "RUNTYPE", "DEMAND_POE_TYPE", "DAY", "CONSTRAINTID", "AGGREGATION_PERIOD"]
time_column = "RUN_DATETIME"
load_mode = "append"
visibility = "PUBLIC"

[temporal]
cutoff = "RUN_DATETIME"
entity = ["RUNTYPE", "DEMAND_POE_TYPE", "CONSTRAINTID", "AGGREGATION_PERIOD"]
order = ["RUN_DATETIME", "RUN_NO", "VERSIONNO", "LASTCHANGED"]
