# The declaration of METERDATA_INTERCONNECTOR: kept by hand.
name = "METERDATA_INTERCONNECTOR"
package = "METER_DATA"
report_pairs = [["METERDATA", "INTERCONNECTOR"]]
primary_key = ["CASE_ID", "SETTLEMENTDATE", "INTERCONNECTORID", "PERIODID"]
time_column = "SETTLEMENTDATE"
load_mode = "append"
visibility = "PUBLIC"

[temporal]
cutoff = "LASTCHANGED"
entity = ["CASE_ID", "INTERCONNECTORID", "PERIODID"]
order = ["LASTCHANGED"]
origin = "derived"

[temporal.valid]
column = "SETTLEMENTDATE"
kind = "interval_end"
