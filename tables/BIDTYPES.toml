# The declaration of BIDTYPES: kept by hand.
name = "BIDTYPES"
report_pairs = [["MARKET_CONFIG", "BIDTYPES"]]
primary_key = ["BIDTYPE", "EFFECTIVEDATE", "VERSIONNO"]
load_mode = "snapshot"
