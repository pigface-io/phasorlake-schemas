# The declaration of PREDISPATCHLOAD: kept by hand.
name = "PREDISPATCHLOAD"
package = "PRE_DISPATCH"
report_pairs = [["PREDISPATCH", "UNIT_SOLUTION"]]
primary_key = ["DUID", "DATETIME"]
time_column = "DATETIME"
load_mode = "append"
visibility = "PUBLIC"

[temporal]
cutoff = "LASTCHANGED"
entity = ["DUID", "INTERVENTION"]
order = ["PREDISPATCHSEQNO", "RUNNO", "LASTCHANGED"]
origin = "derived"

[temporal.valid]
column = "DATETIME"
kind = "interval_end"
