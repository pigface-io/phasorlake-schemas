# The declaration of BILLINGDAYTRK: kept by hand.
name = "BILLINGDAYTRK"
report_pairs = [["BILLING", "DAYTRK"]]
primary_key = ["CONTRACTYEAR", "WEEKNO", "BILLRUNNO", "SETTLEMENTDATE"]
time_column = "SETTLEMENTDATE"
