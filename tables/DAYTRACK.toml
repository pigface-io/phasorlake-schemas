# The declaration of DAYTRACK: kept by hand.
name = "DAYTRACK"
package = "SETTLEMENT_DATA"
report_pairs = [["SETTLEMENTS", "DAYTRACK"]]
primary_key = ["SETTLEMENTDATE", "EXPOSTRUNNO"]
time_column = "SETTLEMENTDATE"
load_mode = "append"
visibility = "PUBLIC"

[temporal]
cutoff = "LASTCHANGED"
entity = ["EXPOSTRUNNO"]
order = ["LASTCHANGED"]
origin = "derived"

[temporal.valid]
column = "SETTLEMENTDATE"
kind = "interval_end"
