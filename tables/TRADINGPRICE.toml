# The declaration of TRADINGPRICE: kept by hand.
name = "TRADINGPRICE"
report_pairs = [["TRADING", "PRICE"]]
primary_key = ["SETTLEMENTDATE", "RUNNO", "REGIONID", "PERIODID"]
time_column = "SETTLEMENTDATE"
load_mode = "append"
visibility = "PUBLIC"

[temporal]
cutoff = "LASTCHANGED"
entity = ["REGIONID", "PERIODID"]
order = ["RUNNO", "LASTCHANGED"]
origin = "derived"

[temporal.valid]
column = "SETTLEMENTDATE"
kind = "interval_end"
