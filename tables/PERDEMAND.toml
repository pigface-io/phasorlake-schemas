# The declaration of PERDEMAND: kept by hand.
name = "PERDEMAND"
package = "DEMAND_FORECASTS"
report_pairs = [["DEMAND", "PERIOD"]]
primary_key = ["SETTLEMENTDATE", "REGIONID", "OFFERDATE", "PERIODID", "VERSIONNO"]
time_column = "SETTLEMENTDATE"
load_mode = "append"
visibility = "PUBLIC"

[temporal]
cutoff = "OFFERDATE"
entity = ["REGIONID", "PERIODID"]
order = ["OFFERDATE", "VERSIONNO", "LASTCHANGED"]
origin = "derived"

[temporal.valid]
column = "SETTLEMENTDATE"
kind = "interval_end"
