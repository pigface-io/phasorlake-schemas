# The declaration of NZ_MARKET_SHARE_TRENDS_BY_NETWORK_REPORTING_REGION: first
# drafted from the census of emidatasets.blob.core.windows.net, kept by hand.
# Retail market share by network reporting region: for each month end, region
# and retailer (participant code and entity), the ICPs supplied and the share
# of the region's, from December 2003, as a snapshot a file, dated by the
# month it describes; each file is the whole table as of its date. Files:
# Datasets/Retail/MarketStructure/. Free to reuse under CC BY 4.0, attributed
# to the Electricity Authority.
name = "NZ_MARKET_SHARE_TRENDS_BY_NETWORK_REPORTING_REGION"
report_pairs = [["EMI", "MARKET_SHARE_TRENDS_BY_NETWORK_REPORTING_REGION"]]
load_mode = "snapshot"
visibility = "PUBLIC"

[[override]]
column = "ICP_COUNT"
type = "long"
reason = "a count of installation control points (ICPs), whole; the census would choose a decimal of its digits"
