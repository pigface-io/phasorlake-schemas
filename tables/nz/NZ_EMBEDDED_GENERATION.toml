# The declaration of NZ_EMBEDDED_GENERATION: first drafted from the census of
# emidatasets.blob.core.windows.net, kept by hand. Metered half-hourly
# embedded generation at each point of connection, by network, participant,
# loss code and flow direction: one file a month from October 1998, a row a
# point of connection and trading day with a column a trading period, read
# here as a row a period (QUANTITY, kilowatt hours). Files:
# Datasets/Wholesale/Metered_data/Embedded_generation/. Free to reuse under CC
# BY 4.0, attributed to the Electricity Authority.
name = "NZ_EMBEDDED_GENERATION"
report_pairs = [["EMI", "EMBEDDED_GENERATION"]]
time_column = "TRADING_DATE"
load_mode = "append"
visibility = "PUBLIC"

[[override]]
column = "TRADING_PERIOD"
type = "long"
reason = "a period number, 1 to 48 (46 or 50 on the days daylight saving changes), read from the TP1..TP50 column heads; the census sees whole numbers and would choose decimal(2, 0)"

[[derive]]
column = "INTERVAL_START_UTC_US"
rule = "nz_trading_period_start"
from = ["TRADING_DATE", "TRADING_PERIOD"]
reason = "the instant the half hour starts: period n is the n-th half hour from local midnight of the trading date, through New Zealand daylight saving"
