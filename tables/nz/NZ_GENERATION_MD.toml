# The declaration of NZ_GENERATION_MD: first drafted from the census of
# emidatasets.blob.core.windows.net, kept by hand. Each generating site's
# metered half-hourly output by point of connection, network, generator, fuel
# and technology code, as the Electricity Authority publishes it: one file a
# month from August 1997, about five weeks behind, a row a site and trading
# day with a column a trading period, read here as a row a period (QUANTITY,
# kilowatt hours; the file carries no unit column; a double, as one month of
# 2014 wrote values with eighteen decimals). The fuel and technology codes are
# as published, not normalised. Files:
# Datasets/Wholesale/Generation/Generation_MD/. Free to reuse under CC BY 4.0,
# attributed to the Electricity Authority.
name = "NZ_GENERATION_MD"
report_pairs = [["EMI", "GENERATION_MD"]]
time_column = "TRADING_DATE"
load_mode = "append"
visibility = "PUBLIC"

[[override]]
column = "TRADING_PERIOD"
type = "long"
reason = "a period number, 1 to 48 (46 or 50 on the days daylight saving changes), read from the TP1..TP50 column heads; the census sees whole numbers and would choose decimal(2, 0)"

[[derive]]
column = "INTERVAL_START_UTC_US"
rule = "nz_trading_period_start"
from = ["TRADING_DATE", "TRADING_PERIOD"]
reason = "the instant the half hour starts: period n is the n-th half hour from local midnight of the trading date, through New Zealand daylight saving"
