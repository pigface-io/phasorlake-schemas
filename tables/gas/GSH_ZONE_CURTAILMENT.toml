# The declaration of GSH_ZONE_CURTAILMENT: first drafted from the census and the data model, kept by hand.
name = "GSH_ZONE_CURTAILMENT"
report_pairs = [["GSH", "ZONE_CURTAILMENT_INFORMATION"]]
primary_key = ["FACILITY_ID", "GAS_DATE", "SERVICE_POINT_ID"]
time_column = "GAS_DATE"
load_mode = "append"
visibility = "PUBLIC"

[temporal]
cutoff = "LASTCHANGED"
entity = ["FACILITY_ID", "SERVICE_POINT_ID"]
order = ["LASTCHANGED"]
origin = "derived"

[temporal.valid]
column = "GAS_DATE"
kind = "instant"
