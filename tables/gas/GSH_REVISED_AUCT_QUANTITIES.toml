# The declaration of GSH_REVISED_AUCT_QUANTITIES: first drafted from the census and the data model, kept by hand.
name = "GSH_REVISED_AUCT_QUANTITIES"
report_pairs = [["GSH", "REVISED_AUCTION_QUANTITIES"]]
primary_key = ["AUCTION_DATE", "FACILITY_ID", "GAS_DATE", "SERVICE_TYPE"]
time_column = "AUCTION_DATE"
