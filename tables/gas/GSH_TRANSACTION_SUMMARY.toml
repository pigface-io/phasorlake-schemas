# The declaration of GSH_TRANSACTION_SUMMARY: first drafted from the census and the data model, kept by hand.
name = "GSH_TRANSACTION_SUMMARY"
report_pairs = [["GSH", "TRANSACTION_SUMMARY"]]
primary_key = ["CURRENTDATE", "FROM_GAS_DATE", "PRODUCT_LOCATION", "PRODUCT_TYPE", "TO_GAS_DATE"]
time_column = "CURRENTDATE"
load_mode = "append"
visibility = "PUBLIC"

[temporal]
cutoff = "LASTCHANGED"
entity = ["PRODUCT_LOCATION", "PRODUCT_TYPE", "FROM_GAS_DATE", "TO_GAS_DATE"]
order = ["LASTCHANGED"]
origin = "hand"

[temporal.valid]
column = "CURRENTDATE"
kind = "instant"
